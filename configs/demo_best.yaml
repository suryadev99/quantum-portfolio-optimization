# The recommended pipeline: Marchenko-Pastur denoising -> modularity clusters -> warm-start QAOA ->
# exact recombination -> audited menu. Synthetic data, noiseless local simulator, well under a minute.
# Compare with demo_small.yaml (cold start, hierarchical clustering). Not investment advice.
run:
  name: demo_best
  seed: 7
  output_dir: outputs/demo_best

data:
  source: synthetic
  synthetic:
    n_assets: 40
    n_sectors: 5
    n_factors: 3
    n_days: 500

mandate:
  K: 10
  lambda_risk: 3.0
  w_max: 0.2

decomposition:
  clusterer: modularity
  denoise: marchenko_pastur
  max_cluster_size: 10

solver:
  algorithm: qaoa
  start: warm
  warm_epsilon: 0.25
  p_layers: 2
  max_iterations: 40
  shots: 2048
  backend:
    type: simulator

menu:
  size: 8
