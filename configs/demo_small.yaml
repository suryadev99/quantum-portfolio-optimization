# Small end-to-end demo: 40 synthetic assets, K=10, local noiseless simulator. Runs in well under a minute.
run:
  name: demo_small
  seed: 7
  output_dir: outputs/demo_small

data:
  source: synthetic
  synthetic:
    n_assets: 40
    n_sectors: 5
    n_factors: 3
    n_days: 500

mandate:
  K: 10
  lambda_risk: 3.0
  w_max: 0.2

decomposition:
  max_cluster_size: 10

solver:
  algorithm: qaoa
  p_layers: 2
  max_iterations: 40
  shots: 2048
  backend:
    type: simulator

menu:
  size: 8
