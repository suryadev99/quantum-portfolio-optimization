[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qportfolio"
version = "0.1.0"
description = "Quantum-sampled, cluster-decomposed portfolio selection engine with built-in classical benchmarking (IBM Qiskit)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "cvxpy>=1.4",
    "pyscipopt>=5",
    "numba>=0.59",
    "matplotlib>=3.8",
    "qiskit>=2.1",
    "qiskit-aer>=0.15",
    "qiskit-ibm-runtime>=0.40",
    "qiskit-optimization>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5"]
demo = ["streamlit>=1.40", "plotly>=5.20", "networkx>=3.2"]

[project.scripts]
qportfolio = "qportfolio.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q -m 'not hardware'"
markers = [
    "hardware: opt-in tests that need real IBM Quantum credentials (run with -m hardware)",
    "slow: slower integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/qportfolio"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108", "RUF012"]
